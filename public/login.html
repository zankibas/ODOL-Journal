<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Login | Oral Dentistry and Odontology Letters</title>
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style>
		body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #eef1f4; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
		.login_card { background: #fff; width: 100%; max-width: 420px; padding: 30px; border-radius: 4px; border: 1px solid #cbd5e1; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
		.login_title { font-size: 18px; font-weight: bold; color: #1e293b; margin-top: 0; margin-bottom: 6px; text-align: center; }
		.sub_title { font-size: 13px; color: #64748b; text-align: center; margin-bottom: 24px; }
		.form_group { margin-bottom: 16px; }
		label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 6px; }
		input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
		input:focus { outline: none; border-color: #006699; }
		button { width: 100%; padding: 11px; background: #006699; color: #fff; font-size: 14px; font-weight: bold; border: none; border-radius: 4px; cursor: pointer; }
		button:hover { background: #004d73; }
		.back_link { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: #006699; text-decoration: none; }
		.demo_badge { background: #eff6ff; border: 1px solid #bfdbfe; border-radius: 4px; padding: 10px; font-size: 12px; color: #1e40af; margin-top: 20px; line-height: 1.4; }
	</style>
</head>
<body>
	<div class="login_card">
		<div class="login_title">OJS Editorial Login</div>
		<div class="sub_title">Oral Dentistry and Odontology Letters</div>
		<form onsubmit="doLogin(event)">
			<div class="form_group">
				<label>Username</label>
				<input type="text" id="username" placeholder="Masukkan username (e.g. editor_utama)" required>
			</div>
			<div class="form_group">
				<label>Password</label>
				<input type="password" id="password" placeholder="Masukkan password" required>
			</div>
			<button type="submit">Login ke Dashboard</button>
		</form>
		<div class="demo_badge">
			<strong>Akses Demo Tugas:</strong><br>
			Anda dapat login menggunakan username <code>editor_utama</code> atau <code>admin</code> (Password bebas).
		</div>
		<a href="/index.html" class="back_link">&larr; Kembali ke Halaman Depan Jurnal</a>
	</div>
	<script>
		function doLogin(e) {
			e.preventDefault();
			const u = document.getElementById('username').value;
			localStorage.setItem('pkp_user', JSON.stringify({ name: u, role: "Journal Editor & Manager" }));
			window.location.href = '/dashboard.html';
		}
	</script>
</body>
</html>
